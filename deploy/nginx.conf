# nginx site for https://yourshelter.ocir-dev.my.id → container on 127.0.0.1:3030
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/yourshelter
#   sudo ln -s /etc/nginx/sites-available/yourshelter /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourshelter.ocir-dev.my.id     # HTTPS (adds the 443 block + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name yourshelter.ocir-dev.my.id;

    client_max_body_size 16k;

    # Live updates (Server-Sent Events) must not be buffered or timed out
    location ~ ^/api/boards/[^/]+/stream$ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
